name: aurora-searxng

services:
  core:
    image: docker.io/searxng/searxng:latest
    restart: "no"
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - ./.env
    environment:
      SEARXNG_REDIS_URL: redis://valkey:6379/0
    volumes:
      - ./core-config:/etc/searxng:rw
      - searxng-cache:/var/cache/searxng
    depends_on:
      - valkey

  valkey:
    image: docker.io/valkey/valkey:9-alpine
    restart: "no"
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - valkey-data:/data

volumes:
  searxng-cache:
  valkey-data:
